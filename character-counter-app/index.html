<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Character counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="main">
        <div class="container">
            <h1>Character counter app</h1>
            <textarea name="characters" id="count"></textarea>
            <div class="bottom">
                <p>character <span id="total"> 0</span></p>
                <p>character left <span id="left"> 50</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
