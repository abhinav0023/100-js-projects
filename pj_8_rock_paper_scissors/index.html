<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <div id="heading">
        <h1>Rock Paper Scissors</h1>
      </div>
      <div id="controls">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button> <!-- Fixed ID issue -->
      </div>
      <div id="results">
        <h2 id="result">Choose your move!</h2> <!-- Added result display -->
        <div class="score">Your Score: <span id="your_Result">0</span></div>
        <div class="score">Computer Score: <span id="computer_Result">0</span></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
